# If docker.io is blocked, copy .env.example to .env and set QDRANT_IMAGE to a mirror.
services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.17.1}
    container_name: knowledge-base-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
